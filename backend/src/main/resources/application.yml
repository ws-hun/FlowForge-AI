server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: flowforge-ai-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${SPRING_DATASOURCE_USERNAME:flowforge}
    password: ${SPRING_DATASOURCE_PASSWORD:flowforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

flowforge:
  frontend-url: ${FRONTEND_URL:http://localhost:10086}
  ai:
    http:
      connect-timeout: ${FLOWFORGE_AI_CONNECT_TIMEOUT:10s}
      read-timeout: ${FLOWFORGE_AI_READ_TIMEOUT:120s}
  security:
    encryption-key: ${FLOWFORGE_ENCRYPTION_KEY:}
    key-file: ${FLOWFORGE_KEY_FILE:.flowforge/master.key}
  auth:
    enabled: ${FLOWFORGE_AUTH_ENABLED:true}
    session-duration: ${FLOWFORGE_AUTH_SESSION_DURATION:30d}
    secure-cookie: ${FLOWFORGE_SECURE_COOKIE:false}
