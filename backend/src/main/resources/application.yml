server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: flowforge-ai-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${SPRING_DATASOURCE_USERNAME:flowforge}
    password: ${SPRING_DATASOURCE_PASSWORD:flowforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

flowforge:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  security:
    encryption-key: ${FLOWFORGE_ENCRYPTION_KEY:}
    key-file: ${FLOWFORGE_KEY_FILE:.flowforge/master.key}
